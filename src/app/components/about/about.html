<main class="flex flex-col min-h-screen flex-grow flex flex-col"> 
    <header class="mt-7">
        <figure class="relative w-56 mx-auto max-w-sm transition-all duration-300 cursor-pointer filter grayscale hover:grayscale-0 animate__animated animate__fadeIn animate__slow">
            <a href="#">
                <img class="rounded-full w-56 h-56" src="https://flowbite.com/docs/images/examples/image-4@2x.jpg" alt="image description">
            </a>
        </figure>
    </header>

    <section class="max-w-6xl mx-auto p-6 bg-white shadow-lg rounded-xl mt-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- Columna 1: Sobre mí -->
            <article class="flex flex-col justify-center">
                <h2 class="text-2xl font-bold mb-4">Sobre mí</h2>
                <p class="text-gray-700">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci beatae vero similique, nulla asperiores, <br>
                    eius aliquid, dolorem quae porro veritatis saepe quaerat iusto veniam temporibus autem non enim error. Quos. 
                </p>
            </article>

            <!-- Columna 2: Mis proyectos -->
            <article>
                <h2 class="text-2xl font-bold mb-4">Mis proyectos</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 justify-items-center items-center">
                    <div *ngFor="let img of projects; let i = index"
                        class="rounded-lg animate__animated animate__bounceIn flex justify-center items-center"
                        [style.animationDelay]="i * 100 + 'ms'">
                        <img class="w-[200px] h-auto rounded-lg object-cover" [src]="img" alt="Proyecto">
                    </div>
                </div>
            </article>
        </div>
    </section>
</main>
